[project]
name = "reposage"
version = "0.1.0"
description = "RepoSage: Agentic Codebase Assistant"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "unidiff>=0.7.5",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "docker>=7.0.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "langgraph>=1.2.14",
    "mcp>=2.3.0",
    "hatchling>=1.32.4",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.6",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reposage"]
